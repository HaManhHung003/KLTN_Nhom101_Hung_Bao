# ====================================================================
# CẤU HÌNH HỆ THỐNG BDS PRO BACKEND (SPRING BOOT 3 + MYSQL)
# ====================================================================

# Cổng khởi chạy Server (Mặc định 8080)
server.port=8080

# Cấu hình kết nối MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3307/bds_pro_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
# Mật khẩu MySQL (Để trống nếu dùng XAMPP mặc định, hoặc điền mật khẩu của bạn ví dụ 123456)
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình JWT (JSON Web Token)
app.jwt.secret=bds_pro_jwt_super_secret_key_nhom101_kltn_2026_very_long_string_for_hs512_security
app.jwt.expiration-ms=604800000

# Cấu hình CORS (Cho phép Web ReactJS và App React Native gọi API)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:8081

# Cấu hình Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
